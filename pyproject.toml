[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fva"
version = "0.1.0"
description = "Interpretable directions in radiogenomic latent spaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    {name = "Joseph Rich", email = "jmrich@caltech.edu"}
]
maintainers = [
    {name = "Joseph Rich", email = "jmrich@caltech.edu"}
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "anndata>=0.10",
    "matplotlib>=3.7",
    "tqdm>=4.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0", "nbconvert>=7.0"]
dev = [
    "pytest>=7.0",
    "nbval>=0.10",
    "nbformat>=5.0",
    "nbclient>=0.7",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "jupyter-client>=7.0",
]

[tool.setuptools]
packages = ["fva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "notebook: end-to-end Jupyter notebook execution tests (slow; require a Jupyter kernel)",
]
